## PMW3610 Driver
## https://github.com/badjeff/zmk-pmw3610-driver
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610_ALT=y
CONFIG_ZMK_POINTING=y

## https://github.com/badjeff/zmk-pmw3610-driver/blob/zmk-0.4/src/pmw3610.c
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

## swap-xy, invert-x, invert-y moved to devicetree node attributes (charybdis_pmw3610.dtsi)
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=6

## REST Downshift Configs
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=2000

CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=100
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3000

CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000

CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=300

# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_TOGGLE_KEYCODE=113
CONFIG_DONGLE_SCREEN_BRIGHTNESS_KEYBOARD_CONTROL=y
CONFIG_DONGLE_SCREEN_BRIGHTNESS_UP_KEYCODE=115
CONFIG_DONGLE_SCREEN_BRIGHTNESS_DOWN_KEYCODE=114
